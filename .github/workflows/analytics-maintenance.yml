name: Analytics maintenance

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

jobs:
  aggregate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate daily analytics and enforce retention
        env:
          ANALYTICS_CRON_SECRET: ${{ secrets.ANALYTICS_CRON_SECRET }}
        run: |
          test -n "$ANALYTICS_CRON_SECRET"
          curl --fail --show-error --silent --max-time 60 \
            -X POST https://tiemreudecor.com/api/internal/analytics/maintenance \
            -H "Authorization: Bearer $ANALYTICS_CRON_SECRET"
