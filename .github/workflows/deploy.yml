name: 🚀 Deploy to VPS

# Trigger: tự động chạy khi push lên branch main
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (14.225.210.118)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Kiểm tra VPS có reachable không ────────────────────────────────
      - name: 🔍 Check VPS connectivity
        run: |
          echo "Checking if VPS is reachable on port ${{ secrets.VPS_PORT }}..."
          for i in 1 2 3 4 5; do
            if nc -z -w5 ${{ secrets.VPS_HOST }} ${{ secrets.VPS_PORT }} 2>/dev/null; then
              echo "✅ VPS is reachable!"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed, retrying in 15s..."
            sleep 15
          done
          echo "❌ VPS is not reachable after 5 attempts"
          exit 1

      # ── 3. SSH vào VPS và deploy ──────────────────────────────────────────
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          timeout: 60s
          script: |
            set -e
            echo "🕐 $(date) — Bắt đầu deploy..."

            # ── Vào thư mục app ──────────────────────────────────────────────
            cd /home/deploy/terrarium-shop

            echo "🔎 Checking Node.js version..."
            node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 20 || (major === 20 && minor < 9)) { console.error('Node.js >=20.9.0 is required for Next.js 16. Current: ' + process.versions.node); process.exit(1); } console.log('Node.js OK: ' + process.versions.node);"

            # ── Pull code mới nhất từ GitHub ─────────────────────────────────
            echo "📦 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            DEPLOY_COMMIT=$(git rev-parse --short HEAD)
            echo "Deploy commit: $DEPLOY_COMMIT"

            # ── Cài dependencies (toàn bộ monorepo) ──────────────────────────
            echo "📚 Installing dependencies..."
            npm install --legacy-peer-deps

            # ── Generate Prisma Client + Sync DB Schema ─────────────────────
            echo "🗄️  Generating Prisma client..."
            cd apps/web
            npx prisma generate

            echo "🔄 Syncing DB schema..."
            npx prisma db push --accept-data-loss
            npx prisma migrate deploy || true

            # ── Cập nhật AI env trong .env ───────────────────────────────────
            echo "🤖 Updating AI env..."
            # Xóa dòng Gemini cũ nếu còn
            sed -i '/^GEMINI_API_KEY=/d' .env 2>/dev/null || true
            sed -i '/^GEMINI_MODEL=/d' .env 2>/dev/null || true
            # Đặt OpenAI config (primary provider)
            OPENAI_API_KEY_VALUE='${{ secrets.OPENAI_API_KEY }}'
            if [ -n "$OPENAI_API_KEY_VALUE" ]; then
              if grep -q "^OPENAI_API_KEY=" .env 2>/dev/null; then
                sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$OPENAI_API_KEY_VALUE|" .env
              else
                echo "OPENAI_API_KEY=$OPENAI_API_KEY_VALUE" >> .env
              fi
            fi
            if grep -q "^OPENAI_MODEL=" .env 2>/dev/null; then
              sed -i "s|^OPENAI_MODEL=.*|OPENAI_MODEL=gpt-5-mini|" .env
            else
              echo "OPENAI_MODEL=gpt-5-mini" >> .env
            fi
            if grep -q "^OPENAI_CARE_MODEL=" .env 2>/dev/null; then
              sed -i "s|^OPENAI_CARE_MODEL=.*|OPENAI_CARE_MODEL=gpt-4o-mini|" .env
            else
              echo "OPENAI_CARE_MODEL=gpt-4o-mini" >> .env
            fi
            if grep -q "^OPENAI_FALLBACK_MODEL=" .env 2>/dev/null; then
              sed -i "s|^OPENAI_FALLBACK_MODEL=.*|OPENAI_FALLBACK_MODEL=gpt-4o-mini|" .env
            else
              echo "OPENAI_FALLBACK_MODEL=gpt-4o-mini" >> .env
            fi
            if grep -q "^AI_PROVIDER=" .env 2>/dev/null; then
              sed -i "s|^AI_PROVIDER=.*|AI_PROVIDER=openai|" .env
            else
              echo "AI_PROVIDER=openai" >> .env
            fi
            if grep -q "^AI_CHAT_ENABLED=" .env 2>/dev/null; then
              sed -i "s|^AI_CHAT_ENABLED=.*|AI_CHAT_ENABLED=true|" .env
            else
              echo "AI_CHAT_ENABLED=true" >> .env
            fi
            if grep -q "^APP_VERSION=" .env 2>/dev/null; then
              sed -i "s|^APP_VERSION=.*|APP_VERSION=$DEPLOY_COMMIT|" .env
            else
              echo "APP_VERSION=$DEPLOY_COMMIT" >> .env
            fi
            # Giữ Ollama config làm fallback tạm thời
            if grep -q "^OLLAMA_URL=" .env 2>/dev/null; then
              sed -i "s|^OLLAMA_URL=.*|OLLAMA_URL=http://localhost:11434|" .env
            else
              echo "OLLAMA_URL=http://localhost:11434" >> .env
            fi
            if grep -q "^OLLAMA_MODEL=" .env 2>/dev/null; then
              sed -i "s|^OLLAMA_MODEL=.*|OLLAMA_MODEL=llama3.2:3b|" .env
            else
              echo "OLLAMA_MODEL=llama3.2:3b" >> .env
            fi
            echo "✅ .env updated (OpenAI primary, Ollama fallback)"

            # ── Setup Ollama llama3.2:3b (~2GB) ──────────────────────────────
            echo "🧠 Setting up Ollama llama3.2:3b..."
            # Bật Ollama service nếu chưa bật
            sudo systemctl enable ollama 2>/dev/null || true
            sudo systemctl start ollama 2>/dev/null || true
            # Đợi Ollama sẵn sàng
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
                echo "✅ Ollama is running"
                break
              fi
              echo "⏳ Waiting for Ollama... ($i/5)"
              sleep 5
            done
            # Xóa model cũ llama3:8b (~4.7GB) nếu còn
            ollama rm llama3:8b 2>/dev/null && echo "🗑️  Removed llama3:8b (4.7GB freed)" || echo "ℹ️  llama3:8b not found (OK)"
            # Kéo model mới nếu chưa có
            if ollama list 2>/dev/null | grep -q "llama3.2:3b"; then
              echo "✅ llama3.2:3b already pulled"
            else
              echo "⬇️  Pulling llama3.2:3b (~2GB)..."
              ollama pull llama3.2:3b
              echo "✅ llama3.2:3b ready"
            fi

            # ── Clean stale build cache ───────────────────────────────────────
            echo "🧹 Cleaning old build cache..."
            cd /home/deploy/terrarium-shop
            rm -rf apps/web/.next
            rm -rf .turbo/cache

            # ── Build production (Turbo monorepo) ────────────────────────────
            echo "🏗️  Building Next.js..."
            npm run build

            # ── Reload app với PM2 (zero downtime) ───────────────────────────
            echo "🔁 Reloading PM2..."
            pm2 delete terrarium-shop 2>/dev/null || true
            pm2 start ecosystem.config.js --env production
            pm2 list

            echo "Running local smoke tests..."
            sleep 8
            rm -f /tmp/health.json /tmp/consult-policy.json
            for i in 1 2 3 4 5 6 7 8; do
              if curl -sf -m 10 http://127.0.0.1:3000/api/health?deep=1 -o /tmp/health.json; then
                cat /tmp/health.json
                break
              fi
              echo "Waiting for app health... ($i/8)"
              pm2 logs terrarium-shop --lines 20 --nostream || true
              sleep 5
            done
            test -f /tmp/health.json
            grep -q "$DEPLOY_COMMIT" /tmp/health.json
            curl -sf -m 20 http://127.0.0.1:3000/api/consult \
              -H 'Content-Type: application/json' \
              --data '{"message":"chính sách bảo hành như thế nào","history":[]}' \
              | tee /tmp/consult-policy.json
            grep -q '"source"' /tmp/consult-policy.json
            curl -sf -m 20 http://127.0.0.1:3000/api/consult \
              -H 'Content-Type: application/json' \
              --data '{"message":"san pham be mini con hang","history":[]}' \
              | tee /tmp/consult-product.json
            grep -q '"source":"db"' /tmp/consult-product.json
            curl -sf -m 20 http://127.0.0.1:3000/api/consult \
              -H 'Content-Type: application/json' \
              --data '{"message":"reu vang xu ly sao","history":[]}' \
              | tee /tmp/consult-care.json
            grep -q '"source":"ai"' /tmp/consult-care.json
            curl -sf -m 20 http://127.0.0.1:3000/api/consult \
              -H 'Content-Type: application/json' \
              --data '{"message":"reu co de cham hon khong","history":[]}' \
              | tee /tmp/consult-care-easy.json
            grep -q '"source":"ai"' /tmp/consult-care-easy.json

            # ── Lưu PM2 process list ──────────────────────────────────────────
            pm2 save

            # ── Kiểm tra RAM sau deploy ───────────────────────────────────────
            echo "📊 RAM status:"
            free -h

            echo "✅ Deploy hoàn tất lúc $(date)!"

      # ── 4. Thông báo kết quả ──────────────────────────────────────────────
      - name: ✅ Deploy Success
        if: success()
        run: |
          echo "🎉 Deploy thành công!"
          echo "🌐 Site: https://tiemreudecor.com"
          echo "🤖 AI: OpenAI gpt-5-mini (Ollama fallback)"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

      - name: ❌ Deploy Failed
        if: failure()
        run: |
          echo "💥 Deploy thất bại!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "🔍 Xem logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
