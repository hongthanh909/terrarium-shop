name: 🚀 Deploy to VPS

# Trigger: tự động chạy khi push lên branch main
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (14.225.210.118)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Kiểm tra VPS có reachable không ────────────────────────────────
      - name: 🔍 Check VPS connectivity
        run: |
          echo "Checking if VPS is reachable on port ${{ secrets.VPS_PORT }}..."
          for i in 1 2 3 4 5; do
            if nc -z -w5 ${{ secrets.VPS_HOST }} ${{ secrets.VPS_PORT }} 2>/dev/null; then
              echo "✅ VPS is reachable!"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed, retrying in 15s..."
            sleep 15
          done
          echo "❌ VPS is not reachable after 5 attempts"
          exit 1

      # ── 3. SSH vào VPS và deploy ──────────────────────────────────────────
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          timeout: 60s
          script: |
            set -e
            echo "🕐 $(date) — Bắt đầu deploy..."

            # ── Vào thư mục app ──────────────────────────────────────────────
            cd /home/deploy/terrarium-shop

            # ── Pull code mới nhất từ GitHub ─────────────────────────────────
            echo "📦 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ── Cài dependencies (toàn bộ monorepo) ──────────────────────────
            echo "📚 Installing dependencies..."
            npm install --legacy-peer-deps

            # ── Generate Prisma Client + Sync DB Schema ─────────────────────
            echo "🗄️  Generating Prisma client..."
            cd apps/web
            npx prisma generate

            echo "🔄 Syncing DB schema..."
            npx prisma db push --accept-data-loss
            npx prisma migrate deploy || true

            # ── Clean stale build cache ───────────────────────────────────────
            echo "🧹 Cleaning old build cache..."
            cd /home/deploy/terrarium-shop
            rm -rf apps/web/.next
            rm -rf .turbo/cache

            # ── Build production (Turbo monorepo) ────────────────────────────
            echo "🏗️  Building Next.js..."
            npm run build

            # ── Reload app với PM2 (zero downtime) ───────────────────────────
            echo "🔁 Reloading PM2..."
            pm2 reload ecosystem.config.js --env production \
              || pm2 start ecosystem.config.js --env production

            # ── Lưu PM2 process list ──────────────────────────────────────────
            pm2 save

            # ── Kiểm tra & khởi động Ollama AI ───────────────────────────────
            echo "🤖 Checking Ollama AI..."
            if command -v ollama &> /dev/null; then
              # Đảm bảo Ollama service đang chạy
              sudo systemctl restart ollama 2>/dev/null || true
              sleep 3

              # Kiểm tra kết nối
              if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
                echo "✅ Ollama đang chạy!"
                # Kiểm tra model đã pull chưa
                if ollama list | grep -q "llama3:8b"; then
                  echo "✅ Model llama3:8b sẵn sàng"
                else
                  echo "⏳ Đang tải model llama3:8b (có thể mất vài phút)..."
                  ollama pull llama3:8b &
                  echo "📥 Model đang tải nền, AI sẽ sẵn sàng sau khi tải xong"
                fi
              else
                echo "⚠️ Ollama chưa phản hồi, thử khởi động lại..."
                sudo systemctl start ollama 2>/dev/null || ollama serve &
                sleep 5
                if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
                  echo "✅ Ollama đã khởi động thành công!"
                else
                  echo "⚠️ Ollama chưa sẵn sàng — chatbot sẽ dùng chế độ cơ bản"
                fi
              fi
            else
              echo "⚠️ Ollama chưa được cài đặt — chatbot dùng chế độ cơ bản"
              echo "   Cài đặt: curl -fsSL https://ollama.com/install.sh | sh"
            fi

            echo "✅ Deploy hoàn tất lúc $(date)!"

      # ── 4. Thông báo kết quả ──────────────────────────────────────────────
      - name: ✅ Deploy Success
        if: success()
        run: |
          echo "🎉 Deploy thành công!"
          echo "🌐 Site: https://tiemreudecor.com"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

      - name: ❌ Deploy Failed
        if: failure()
        run: |
          echo "💥 Deploy thất bại!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "🔍 Xem logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
