name: 🚀 Deploy to VPS

# Trigger: tự động chạy khi push lên branch main
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (14.225.210.118)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Kiểm tra VPS có reachable không ────────────────────────────────
      - name: 🔍 Check VPS connectivity
        run: |
          echo "Checking if VPS is reachable on port ${{ secrets.VPS_PORT }}..."
          for i in 1 2 3 4 5; do
            if nc -z -w5 ${{ secrets.VPS_HOST }} ${{ secrets.VPS_PORT }} 2>/dev/null; then
              echo "✅ VPS is reachable!"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed, retrying in 15s..."
            sleep 15
          done
          echo "❌ VPS is not reachable after 5 attempts"
          exit 1

      # ── 3. SSH vào VPS và deploy ──────────────────────────────────────────
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          timeout: 60s
          script: |
            set -e
            echo "🕐 $(date) — Bắt đầu deploy..."

            # ── Vào thư mục app ──────────────────────────────────────────────
            cd /home/deploy/terrarium-shop

            # ── Pull code mới nhất từ GitHub ─────────────────────────────────
            echo "📦 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ── Cài dependencies (toàn bộ monorepo) ──────────────────────────
            echo "📚 Installing dependencies..."
            npm install --legacy-peer-deps

            # ── Generate Prisma Client + Sync DB Schema ─────────────────────
            echo "🗄️  Generating Prisma client..."
            cd apps/web
            npx prisma generate

            # ── Cập nhật .env với Gemini API Key ──────────────────────────────
            echo "🔑 Updating .env with Gemini API Key..."
            # Đảm bảo GEMINI_API_KEY có trong .env
            if grep -q "^GEMINI_API_KEY=" .env 2>/dev/null; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" .env
            else
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            fi
            # Đảm bảo GEMINI_MODEL có trong .env
            if grep -q "^GEMINI_MODEL=" .env 2>/dev/null; then
              sed -i "s|^GEMINI_MODEL=.*|GEMINI_MODEL=gemini-2.0-flash|" .env
            else
              echo "GEMINI_MODEL=gemini-2.0-flash" >> .env
            fi
            echo "✅ .env updated"

            echo "🔄 Syncing DB schema..."
            npx prisma db push --accept-data-loss
            npx prisma migrate deploy || true

            # ── Clean stale build cache ───────────────────────────────────────
            echo "🧹 Cleaning old build cache..."
            cd /home/deploy/terrarium-shop
            rm -rf apps/web/.next
            rm -rf .turbo/cache

            # ── Build production (Turbo monorepo) ────────────────────────────
            echo "🏗️  Building Next.js..."
            npm run build

            # ── Reload app với PM2 (zero downtime) ───────────────────────────
            echo "🔁 Reloading PM2..."
            pm2 reload ecosystem.config.js --env production \
              || pm2 start ecosystem.config.js --env production

            # ── Lưu PM2 process list ──────────────────────────────────────────
            pm2 save

            # ── Ollama AI (DISABLED — VPS 8GB RAM không đủ cho AI model) ────
            # Ollama llama3:8b chiếm ~4.7GB RAM, gây chậm toàn bộ server.
            # Chatbox hiện dùng Smart Knowledge Base (instant, 0 RAM).
            #
            # Để gỡ Ollama trên VPS (giải phóng ~4GB RAM), chạy:
            #   sudo systemctl stop ollama && sudo systemctl disable ollama
            #   ollama rm llama3:8b 2>/dev/null; ollama rm llama3.2:3b 2>/dev/null
            #
            # Để bật lại AI sau (cần nạp Gemini hoặc VPS có GPU):
            #   1. Gemini: nạp credit tại https://aistudio.google.com/billing
            #   2. Bỏ comment AI streaming trong apps/web/app/api/consult/route.ts
            echo "ℹ️  AI chatbox: Smart Knowledge Base mode (no Ollama)"

            echo "✅ Deploy hoàn tất lúc $(date)!"

      # ── 4. Thông báo kết quả ──────────────────────────────────────────────
      - name: ✅ Deploy Success
        if: success()
        run: |
          echo "🎉 Deploy thành công!"
          echo "🌐 Site: https://tiemreudecor.com"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

      - name: ❌ Deploy Failed
        if: failure()
        run: |
          echo "💥 Deploy thất bại!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "🔍 Xem logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
