name: 🚀 Deploy to VPS

# Trigger: tự động chạy khi push lên branch main
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: terrarium-shop-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (14.225.210.118)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      # ── 2. Kiểm tra VPS có reachable không ────────────────────────────────
      - name: 🔍 Check VPS connectivity
        run: |
          echo "Checking if VPS is reachable on port ${{ secrets.VPS_PORT }}..."
          for i in 1 2 3 4 5; do
            if nc -z -w5 ${{ secrets.VPS_HOST }} ${{ secrets.VPS_PORT }} 2>/dev/null; then
              echo "✅ VPS is reachable!"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed, retrying in 15s..."
            sleep 15
          done
          echo "❌ VPS is not reachable after 5 attempts"
          exit 1

      # ── 3. SSH vào VPS và deploy ──────────────────────────────────────────
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          command_timeout: 30m
          timeout: 60s
          script: |
            set -e

            # Prevent concurrent jobs or manual deploys from touching .next together.
            exec 9>/tmp/terrarium-shop-deploy.lock
            if ! flock -w 900 9; then
              echo "Another production deploy still holds the VPS lock."
              exit 1
            fi
            echo "🕐 $(date) — Bắt đầu deploy..."

            # ── Vào thư mục app ──────────────────────────────────────────────
            cd /home/deploy/terrarium-shop

            echo "🔎 Checking Node.js version..."
            node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 20 || (major === 20 && minor < 9)) { console.error('Node.js >=20.9.0 is required for Next.js 16. Current: ' + process.versions.node); process.exit(1); } console.log('Node.js OK: ' + process.versions.node);"

            # ── Pull code mới nhất từ GitHub ─────────────────────────────────
            echo "📦 Pulling latest code..."
            git fetch origin ${{ github.sha }}
            git reset --hard ${{ github.sha }}
            DEPLOY_COMMIT=$(git rev-parse --short HEAD)
            echo "Deploy commit: $DEPLOY_COMMIT"

            # ── Cài dependencies (toàn bộ monorepo) ──────────────────────────
            echo "📚 Installing dependencies..."
            npm install --legacy-peer-deps

            # ── Generate Prisma Client + Sync DB Schema ─────────────────────
            echo "🗄️  Generating Prisma client..."
            cd apps/web
            npx prisma generate

            echo "🔄 Syncing DB schema..."
            npx prisma db push --accept-data-loss
            # db push already created the analytics tables. Record that schema
            # migration before applying later data-only migrations.
            npx prisma migrate resolve --applied 20260714170000_add_first_party_analytics \
              --schema ../../packages/database/prisma/schema.prisma || true
            npx prisma migrate deploy --schema ../../packages/database/prisma/schema.prisma

            echo "Updating Google OAuth env..."
            node <<'NODE'
            const fs = require("fs");
            const envPath = ".env";
            const clientId = process.env.GOOGLE_CLIENT_ID || "";
            const clientSecret = process.env.GOOGLE_CLIENT_SECRET || "";

            if (!clientId || !clientSecret) {
              console.log("Google OAuth secrets are incomplete; keeping the existing VPS configuration.");
              process.exit(0);
            }

            const updates = {
              GOOGLE_CLIENT_ID: clientId,
              GOOGLE_CLIENT_SECRET: clientSecret,
            };
            const current = fs.existsSync(envPath) ? fs.readFileSync(envPath, "utf8") : "";
            const retained = current
              .split(/\r?\n/)
              .filter((line) => !Object.keys(updates).some((key) => line.startsWith(`${key}=`)))
              .filter(Boolean);

            for (const [key, value] of Object.entries(updates)) {
              retained.push(`${key}=${value}`);
            }
            fs.writeFileSync(envPath, `${retained.join("\n")}\n`);
            console.log("Google OAuth env updated.");
            NODE

            # ── Giữ AI tắt ở cả client và server ─────────────────────────────
            echo "🤖 Disabling AI features..."
            for key in NEXT_PUBLIC_AI_CHAT_ENABLED AI_CHAT_ENABLED; do
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=false|" .env
              else
                echo "${key}=false" >> .env
              fi
            done
            if grep -q "^APP_VERSION=" .env 2>/dev/null; then
              sed -i "s|^APP_VERSION=.*|APP_VERSION=$DEPLOY_COMMIT|" .env
            else
              echo "APP_VERSION=$DEPLOY_COMMIT" >> .env
            fi
            echo "✅ AI feature flags set to false"

            # ── Clean stale build cache ───────────────────────────────────────
            echo "🧹 Cleaning old build cache..."
            cd /home/deploy/terrarium-shop
            rm -rf apps/web/.next
            rm -rf .turbo/cache

            # ── Build production (Turbo monorepo) ────────────────────────────
            echo "🏗️  Building Next.js..."
            if ! npm run build; then
              echo "First build failed; clearing generated caches and retrying once..."
              rm -rf apps/web/.next .turbo/cache
              npm run build
            fi

            # ── Reload app với PM2 (zero downtime) ───────────────────────────
            echo "🔁 Reloading PM2..."
            pm2 delete terrarium-shop 2>/dev/null || true
            pm2 start ecosystem.config.js --env production
            pm2 list

            echo "Running local smoke tests..."
            sleep 8
            rm -f /tmp/health.json /tmp/consult-disabled.json
            for i in 1 2 3 4 5 6 7 8; do
              if curl -sf -m 10 http://127.0.0.1:3000/api/health?deep=1 -o /tmp/health.json; then
                cat /tmp/health.json
                break
              fi
              echo "Waiting for app health... ($i/8)"
              pm2 logs terrarium-shop --lines 20 --nostream || true
              sleep 5
            done
            test -f /tmp/health.json
            grep -q "$DEPLOY_COMMIT" /tmp/health.json
            grep -q '"aiEnabled":false' /tmp/health.json
            CONSULT_STATUS=$(curl -sS -m 20 -o /tmp/consult-disabled.json -w '%{http_code}' \
              http://127.0.0.1:3000/api/consult \
              -H 'Content-Type: application/json' \
              --data '{"message":"kiem tra tinh nang AI","history":[]}')
            cat /tmp/consult-disabled.json
            test "$CONSULT_STATUS" = "503"
            grep -q '"source":"disabled"' /tmp/consult-disabled.json

            # ── Lưu PM2 process list ──────────────────────────────────────────
            pm2 save

            # ── Kiểm tra RAM sau deploy ───────────────────────────────────────
            echo "📊 RAM status:"
            free -h

            echo "✅ Deploy hoàn tất lúc $(date)!"

      # ── 4. Thông báo kết quả ──────────────────────────────────────────────
      - name: ✅ Deploy Success
        if: success()
        run: |
          echo "🎉 Deploy thành công!"
          echo "🌐 Site: https://tiemreudecor.com"
          echo "🤖 AI: disabled"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

      - name: ❌ Deploy Failed
        if: failure()
        run: |
          echo "💥 Deploy thất bại!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "🔍 Xem logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
